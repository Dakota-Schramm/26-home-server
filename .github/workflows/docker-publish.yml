name: Build and publish Docker images

# Pushes the mailer and scraper images to GHCR on every push to main that
# touches relevant code. New container packages scoped to a personal GitHub
# account default to private on first publish, and GHCR has no API to patch
# package visibility after the fact (it's web-UI only, under the package's
# Settings page) -- so there's nothing more to configure here. After the
# first run, confirm both packages show as "Private" on their GHCR settings
# page.

on:
  push:
    branches: [main]
    paths:
      - "packages/mailer/**"
      - "packages/scraper/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: mailer
            dockerfile: packages/mailer/Dockerfile
            image: ghcr.io/dakota-schramm/26-home-server-mailer
          - service: scraper
            dockerfile: packages/scraper/Dockerfile
            image: ghcr.io/dakota-schramm/26-home-server-scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
